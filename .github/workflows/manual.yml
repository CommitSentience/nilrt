name: Manual workflow

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Provide the path to the upstream merge script'
        default: 'scripts/dev/upstream_merge/upstream_merge_and_test.py'
        required: true
        type: string

      workItemID:
        description: 'Provide Work Item ID for the upstream merge script'
        default: 'None'
        required: true
        type: string

      skip_merge:
        description: 'Skip the merge step'
        default: 'False'
        required: false
        type: choice
        options:
          - 'True'
          - 'False'

jobs:
  Run_upstream_merge_and_test_script:
    runs-on: self-hosted
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Set Git pull behavior
        run: git config pull.rebase false

      - name: Run Python upstream merge script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Running script: ${{ inputs.filename }}"
          python3 "${{ inputs.filename }}" -w "${{ inputs.workItemID }}" -s "${{ inputs.skip_merge }}"
